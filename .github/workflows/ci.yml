name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff==0.16.9
          ruff check . --output-format github
      - name: Package versions agree
        run: python scripts/check_version.py

  core:
    name: Core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Fonts used for embedding substitutes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install ".[test]"
      - run: pytest -q

  server:
    name: Server and crawler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            server/pyproject.toml
      - run: pip install ../core ".[test]"
      - run: pytest -q

  pdfua:
    name: PDF/UA conformance (veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fonts used for embedding substitutes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: docker/verapdf/pom.xml
      - name: Install veraPDF from Maven Central
        run: |
          mkdir -p "$RUNNER_TEMP/verapdf"
          mvn -q -B -f docker/verapdf/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DoutputDirectory="$RUNNER_TEMP/verapdf/lib" -DincludeScope=runtime
          cat > "$RUNNER_TEMP/verapdf/verapdf" <<EOF
          #!/bin/sh
          exec java -Xss8m -cp "$RUNNER_TEMP/verapdf/lib/*" org.verapdf.apps.GreenfieldCliWrapper "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/verapdf/verapdf"
          "$RUNNER_TEMP/verapdf/verapdf" --version | head -1
          echo "READPATH_VERAPDF=$RUNNER_TEMP/verapdf/verapdf" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install "./core[test]"
      - name: Auto-tagged and reviewed files pass veraPDF PDF/UA-1
        working-directory: core
        env:
          READPATH_REQUIRE_VERAPDF: "1"
        run: pytest -v tests/test_conformance.py

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  package:
    name: Release packages
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Versions match the tag
        if: github.ref_type == 'tag'
        run: python scripts/check_version.py "$GITHUB_REF_NAME"
      - name: Python packages (sdist and wheel)
        run: |
          pip install build
          python -m build core -o dist
          python -m build server -o dist
          echo "VERSION=$(python -c "import tomllib; print(tomllib.load(open('core/pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app bundle
        run: |
          (cd web && npm ci && npm run build)
          tar -czf "dist/readpath-web-$VERSION.tar.gz" -C web/dist .
      - name: Packages install and run
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/readpath_core-*.whl dist/readpath_server-*.whl
          "$RUNNER_TEMP/venv/bin/readpath" --version
          "$RUNNER_TEMP/venv/bin/python" -c "from readpath_server.api import create_app; print('server imports')"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          python scripts/release_notes.py "v$VERSION" > release-notes.md
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/readpath:$VERSION"
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker run -d -p 8000:8000 -v readpath-data:/data $image"
            echo '```'
            echo
            echo "Then open http://localhost:8000. Python packages, the web app bundle and checksums are attached below."
          } >> release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [core, server, web, package]
    steps:
      - uses: actions/checkout@v7
      - name: Release files download and match their checksums
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files
      - run: cd "$RUNNER_TEMP/release-files/dist" && sha256sum -c SHA256SUMS.txt
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: readpath
          tags: type=raw,value=ci
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name readpath -p 8000:8000 readpath:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Make sample PDFs
        run: |
          pip install reportlab pillow
          mkdir -p "$RUNNER_TEMP/samples"
          python core/tests/samples.py "$RUNNER_TEMP/samples"
      - name: Smoke test (upload, auto-fix, OCR, fonts, veraPDF)
        run: python scripts/smoke_test.py http://localhost:8000 "$RUNNER_TEMP/samples" --expect-ocr --expect-verapdf --expect-fonts
      - name: Container logs
        if: always()
        run: docker logs readpath 2>&1 | tail -200
