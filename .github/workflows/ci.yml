name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff==0.16.9
          ruff check . --output-format github
      - name: Package versions agree
        run: python scripts/check_version.py

  core:
    name: Core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Fonts used for embedding substitutes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install ".[test]"
      - run: pytest -q

  server:
    name: Server and crawler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            server/pyproject.toml
      - run: pip install ../core ".[test]"
      - run: pytest -q

  pdfua:
    name: PDF/UA conformance (veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fonts used for embedding substitutes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: docker/verapdf/pom.xml
      - name: Install veraPDF from Maven Central
        run: |
          mkdir -p "$RUNNER_TEMP/verapdf"
          mvn -q -B -f docker/verapdf/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DoutputDirectory="$RUNNER_TEMP/verapdf/lib" -DincludeScope=runtime
          cat > "$RUNNER_TEMP/verapdf/verapdf" <<EOF
          #!/bin/sh
          exec java -Xss8m -cp "$RUNNER_TEMP/verapdf/lib/*" org.verapdf.apps.GreenfieldCliWrapper "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/verapdf/verapdf"
          "$RUNNER_TEMP/verapdf/verapdf" --version | head -1
          echo "READPATH_VERAPDF=$RUNNER_TEMP/verapdf/verapdf" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install "./core[test]"
      - name: Auto-tagged and reviewed files pass veraPDF PDF/UA-1
        working-directory: core
        env:
          READPATH_REQUIRE_VERAPDF: "1"
        run: pytest -v tests/test_conformance.py

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, core, server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: readpath:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name readpath -p 8000:8000 readpath:ci
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Make sample PDFs
        run: |
          pip install reportlab pillow
          mkdir -p "$RUNNER_TEMP/samples"
          python core/tests/samples.py "$RUNNER_TEMP/samples"
      - name: Smoke test (upload, auto-fix, OCR, fonts, veraPDF)
        run: python scripts/smoke_test.py http://localhost:8000 "$RUNNER_TEMP/samples" --expect-ocr --expect-verapdf --expect-fonts
      - name: Container logs
        if: always()
        run: docker logs readpath 2>&1 | tail -200
