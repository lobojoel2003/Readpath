name: Release

# Push a version tag to publish a release:
#   git tag -a v0.1.0 -m "Readpath 0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build packages
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches package versions
        run: python scripts/check_version.py "$GITHUB_REF_NAME"
      - name: Python packages (sdist and wheel)
        run: |
          pip install build
          python -m build core -o dist
          python -m build server -o dist
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app bundle
        run: |
          cd web
          npm ci
          npm run build
          tar -czf "../dist/readpath-web-${GITHUB_REF_NAME#v}.tar.gz" -C dist .
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/readpath:${GITHUB_REF_NAME#v}"
          {
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker run -d -p 8000:8000 -v readpath-data:/data $image"
            echo '```'
            echo
            echo "Then open http://localhost:8000. Python packages, the web bundle and checksums are attached below."
          } >> release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  image:
    name: Publish Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/readpath
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Readpath
            org.opencontainers.image.description=Check and fix the accessibility of every PDF on a website
            org.opencontainers.image.licenses=AGPL-3.0-or-later AND Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
      - uses: softprops/action-gh-release@v2
        with:
          name: Readpath ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
