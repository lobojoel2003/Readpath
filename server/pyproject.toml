[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "readpath-server"
version = "0.1.0"
description = "Readpath web app: crawl a website, list and score every PDF, fix what is safe, and guide people through the rest."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Readpath contributors" }]
dependencies = [
  "readpath-core",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "reportlab>=4"]

[project.scripts]
readpath-server = "readpath_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src", "../core/tests"]
